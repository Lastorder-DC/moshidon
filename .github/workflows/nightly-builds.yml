name: Nightly build

on:
  push:
    branches: [ "occm" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'
        cache: gradle

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v1
      with:
        fileName: 'nightly_keystore.jks'
        fileDir: './mastodon/keystore/'
        encodedString: ${{ secrets.KEYSTORE }}

    - name: Build with Gradle
      run: ./gradlew assembleNightly
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        CURRENT_DATE: ${{ steps.date.outputs.date }}

    # Reuses a single rolling "nightly" pre-release/tag instead of piling up a new GitHub Release
    # (or Actions artifact, which expires and needs a login to download) on every push - each run
    # replaces the previous nightly asset in place.
    - name: Publish to rolling nightly pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: Nightly build (${{ steps.date.outputs.date }})
        prerelease: true
        target_commitish: ${{ github.sha }}
        files: mastodon/build/outputs/apk/nightly/occm-nightly.apk
