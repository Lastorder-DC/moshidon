plugins {
	id 'com.android.application'
}

// signingConfigs/buildTypes blocks below run unconditionally during Gradle configuration for
// every task - including ones (like assembleFdroidRelease) that never actually use these values -
// so this must not throw just because local.properties isn't there (e.g. on F-Droid's buildserver
// or CI workflows that don't need this particular signingConfig/buildType).
def readBuildProperty(String key) {
	def envValue = System.getenv(key)
	if (envValue != null) return envValue
	def localPropsFile = project.rootProject.file('local.properties')
	if (!localPropsFile.exists()) return null
	Properties properties = new Properties()
	properties.load(localPropsFile.newDataInputStream())
	return properties.getProperty(key)
}

// Deliberately no `java { toolchain { languageVersion = ... } }` here: that forces Gradle to
// find/provision an exact-version JDK to run javac with, which fails hard on environments that
// only have a different JDK installed and can't auto-provision one (e.g. F-Droid's buildserver,
// which only has JDK 21 and disables toolchain auto-provisioning). compileOptions below already
// pins the bytecode target to 17 without requiring the *running* JDK to be exactly 17 - any
// reasonably recent JDK's javac can cross-compile down to that target.

android {
	compileSdk 35
	defaultConfig {
		manifestPlaceholders = [oAuthScheme:"occm-android-auth"]
		archivesBaseName = "occm"
		applicationId "cc.occm.app"
		minSdk 23
		targetSdk 35
		versionCode 113
		versionName "2.3.0+fork.113.occmdm"
		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['ar-rSA', 'ar-rDZ', 'be-rBY', 'bn-rBD', 'bs-rBA', 'ca-rES', 'cs-rCZ', 'da-rDK', 'de-rDE', 'el-rGR', 'es-rES', 'eu-rES', 'fa-rIR', 'fi-rFI', 'fil-rPH', 'fr-rFR', 'ga-rIE', 'gd-rGB', 'gl-rES', 'hi-rIN', 'hr-rHR', 'hu-rHU', 'hy-rAM', 'ig-rNG', 'in-rID', 'is-rIS', 'it-rIT', 'iw-rIL', 'ja-rJP', 'kab', 'ko-rKR', 'my-rMM', 'nl-rNL', 'no-rNO', 'oc-rFR', 'pl-rPL', 'pt-rBR', 'pt-rPT', 'ro-rRO', 'ru-rRU', 'si-rLK', 'sl-rSI', 'sv-rSE', 'th-rTH', 'tr-rTR', 'uk-rUA', 'ur-rIN', 'vi-rVN', 'zh-rCN', 'zh-rTW']
    }

	dependenciesInfo {
		// Disables dependency metadata when building APKs.
		includeInApk = false
		// Disables dependency metadata when building Android App Bundles.
		includeInBundle = false
	}

	signingConfigs {
		nightly{
			storeFile = file("keystore/nightly_keystore.jks")
			storePassword readBuildProperty('SIGNING_STORE_PASSWORD')
			keyAlias readBuildProperty('SIGNING_KEY_ALIAS')
			keyPassword readBuildProperty('SIGNING_KEY_PASSWORD')
		}

		release{
			storeFile = file("keystore/release_keystore.jks")
			storePassword readBuildProperty('RELEASE_SIGNING_STORE_PASSWORD')
			keyAlias readBuildProperty('RELEASE_SIGNING_KEY_ALIAS')
			keyPassword readBuildProperty('RELEASE_SIGNING_KEY_PASSWORD')
		}
	}

	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
		debug{
			debuggable true
			versionNameSuffix '-debug'
			applicationIdSuffix '.debug'
			manifestPlaceholders = [oAuthScheme:"occm-android-debug-auth"]
		}
		githubRelease{
			initWith release
		}
		nightly{
			versionNameSuffix '-nightly+@' + readBuildProperty('CURRENT_DATE')
			applicationIdSuffix '.nightly'

			signingConfig signingConfigs.nightly
			manifestPlaceholders = [oAuthScheme:"occm-android-nightly-auth"]
		}
		playRelease{
			initWith release
			minifyEnabled true
			shrinkResources true
			versionNameSuffix '-play'
			signingConfig signingConfigs.release
		}
		githubRelease {
			initWith release
			versionNameSuffix '-github'
		}
		fdroidRelease {
			initWith release
			vcsInfo.include true
			// The F-droid build system doesn't like this at all for some reason.
//			versionNameSuffix '-fdroid'
//			signingConfig signingConfigs.release
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
		coreLibraryDesugaringEnabled true
	}
	sourceSets{
		githubRelease{
			setRoot "src/github"
		}
		debug {
			setRoot "src/debug"
			java.srcDirs += ["src/firebase/java"]
		}
		nightly {
			java.srcDirs += ["src/firebase/java"]
		}
		playRelease {
			java.srcDirs += ["src/firebase/java"]
		}
	}
	namespace 'org.joinmastodon.android'
	lint {
		abortOnError false
		checkReleaseBuilds false
	}

	buildFeatures {
		buildConfig true
	}
}

dependencies {
	api 'androidx.annotation:annotation:1.6.0'
	implementation 'com.squareup.okhttp3:okhttp:3.14.9'
	implementation 'me.grishka.litex:recyclerview:1.2.1.1'
	implementation 'me.grishka.litex:swiperefreshlayout:1.1.0.1'
	implementation('me.grishka.litex:browser:1.4.0') {
		// Firebase (real com.google.guava:guava) and this both ship
		// com.google.common.util.concurrent.ListenableFuture et al. - drop litex's copy so
		// there's only one on the classpath; guava's is a superset and API-compatible.
		exclude group: 'me.grishka.litex', module: 'concurrent'
	}
	implementation 'me.grishka.litex:dynamicanimation:1.1.0-alpha03'
	implementation 'me.grishka.litex:viewpager:1.0.0'
	implementation 'me.grishka.litex:viewpager2:1.0.0'
	implementation 'me.grishka.litex:palette:1.0.0'
	implementation 'me.grishka.appkit:appkit:1.2.16'
	implementation 'com.google.code.gson:gson:2.9.0'
	implementation 'org.jsoup:jsoup:1.14.3'
	implementation 'com.squareup:otto:1.3.8'
	implementation 'de.psdev:async-otto:1.0.3'
	implementation 'org.parceler:parceler-api:1.1.12'
	implementation 'com.github.bottom-software-foundation:bottom-java:2.1.0'
	annotationProcessor 'org.parceler:parceler:1.1.12'
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
	implementation 'org.unifiedpush.android:connector:3.0.7'

	androidTestImplementation 'androidx.test:core:1.5.0'
	androidTestImplementation 'androidx.test.ext:junit:1.1.5'
	androidTestImplementation 'androidx.test:runner:1.5.2'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// firebase.gradle handles its own google-services.json conditionals internally (dependencies
// don't need that file, only the plugins applied from it do) - deleted entirely by F-Droid's
// prebuild step (see the setup guide), which is the only reason this needs a file-exists guard
// at all.
if (file("firebase.gradle").exists()) {
	apply from: 'firebase.gradle'
}
